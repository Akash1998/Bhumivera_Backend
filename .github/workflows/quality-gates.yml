name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test
      - name: Validate startup and migration imports
        run: |
          node --check server.js
          node --check scripts/smokeTest.js
          node -e "const migrations = require('./migrations'); if (migrations.length < 1) process.exit(1); console.log('Loaded ' + migrations.length + ' ordered migrations.'); process.exit(0)"
