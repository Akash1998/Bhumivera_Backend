name: Keep Scanner Backend Available 24/7

on:
  schedule:
    # Keep one production replica available for the scanner PWA 24/7.
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  manage-sleep:
    name: Manage Backend Sleep/Wake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Ensure the backend remains available
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_NAME: Bhumivera_Backend
          RAILWAY_REGION_KEY: asia-southeast1-eqsg3a
          RAILWAY_ENVIRONMENT_NAME: production
        run: |
          node scripts/nightSleepSchedule.js --wake
