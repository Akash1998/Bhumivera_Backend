services:
  - type: web
    name: bhumivera-backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health/live
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://www.bhumivera.com
      - key: FRONTEND_ORIGINS
        value: https://www.bhumivera.com,https://bhumivera.com
      - key: DB_SSL
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OTP_SECRET
        sync: false
      - key: CARRIER_CREDENTIALS_KEY
        sync: false
      - key: SUPPORT_TELEGRAM_BOT_TOKEN
        sync: false
